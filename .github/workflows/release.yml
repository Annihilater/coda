name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64 (Server + Daemon + Web + Deploy Kit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libzstd-dev
      - name: Build Web Console
        run: cd web && bun install && bun run build
      - name: Build coda-server & coda-daemon (release)
        run: cargo build --release -p coda-server -p coda-daemon
      - name: Package Linux x86_64 & Deployment Bundle
        run: |
          mkdir -p dist/coda-server-linux-x86_64 dist/coda-daemon-linux-x86_64 dist/coda-deploy-bundle
          cp target/release/coda-server dist/coda-server-linux-x86_64/
          cp -r web/dist dist/coda-server-linux-x86_64/web-dist
          cp -r migrations dist/coda-server-linux-x86_64/migrations
          cp -r deploy dist/coda-server-linux-x86_64/deploy
          cp README.md dist/coda-server-linux-x86_64/

          cp target/release/coda-daemon dist/coda-daemon-linux-x86_64/
          cp deploy/install-daemon.sh dist/coda-daemon-linux-x86_64/

          cp -r deploy/* dist/coda-deploy-bundle/
          cp deploy/.env.example dist/coda-deploy-bundle/.env.example
          cp -r migrations dist/coda-deploy-bundle/migrations
          cp README.md dist/coda-deploy-bundle/

          tar -C dist -czf dist/coda-server-linux-x86_64.tar.gz coda-server-linux-x86_64
          tar -C dist -czf dist/coda-daemon-linux-x86_64.tar.gz coda-daemon-linux-x86_64
          tar -C dist -czf dist/coda-deploy-bundle.tar.gz coda-deploy-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-artifacts
          path: |
            dist/coda-server-linux-x86_64.tar.gz
            dist/coda-daemon-linux-x86_64.tar.gz
            dist/coda-deploy-bundle.tar.gz

  build-linux-aarch64:
    name: Build Linux ARM64 (Server + Daemon)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libzstd-dev
      - name: Build Web Console
        run: cd web && bun install && bun run build
      - name: Build coda-server & coda-daemon (release)
        run: cargo build --release -p coda-server -p coda-daemon
      - name: Package Linux aarch64
        run: |
          mkdir -p dist/coda-server-linux-aarch64 dist/coda-daemon-linux-aarch64
          cp target/release/coda-server dist/coda-server-linux-aarch64/
          cp -r web/dist dist/coda-server-linux-aarch64/web-dist
          cp -r migrations dist/coda-server-linux-aarch64/migrations
          cp -r deploy dist/coda-server-linux-aarch64/deploy

          cp target/release/coda-daemon dist/coda-daemon-linux-aarch64/
          cp deploy/install-daemon.sh dist/coda-daemon-linux-aarch64/

          tar -C dist -czf dist/coda-server-linux-aarch64.tar.gz coda-server-linux-aarch64
          tar -C dist -czf dist/coda-daemon-linux-aarch64.tar.gz coda-daemon-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-artifacts
          path: |
            dist/coda-server-linux-aarch64.tar.gz
            dist/coda-daemon-linux-aarch64.tar.gz

  build-macos-aarch64:
    name: Build macOS Apple Silicon (GPUI Desktop + Daemon + Server + SwiftUI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Build Web Console
        run: cd web && bun install && bun run build
      - name: Build Rust Release Binaries (coda-desktop GPUI + coda-daemon + coda-server)
        run: cargo build --release -p coda-server -p coda-daemon -p coda-desktop
      - name: Build Apple Swift 6 Native Binaries
        run: cd apple && swift build -c release
      - name: Package macOS Apple Silicon Suite
        run: |
          mkdir -p dist/coda-macos-aarch64 dist/coda-daemon-macos-aarch64
          cp target/release/coda-desktop dist/coda-macos-aarch64/
          cp target/release/coda-daemon dist/coda-macos-aarch64/
          cp target/release/coda-server dist/coda-macos-aarch64/
          cp apple/.build/release/CodaMacApp dist/coda-macos-aarch64/
          cp -r web/dist dist/coda-macos-aarch64/web-dist
          cp -r deploy dist/coda-macos-aarch64/deploy

          cp target/release/coda-daemon dist/coda-daemon-macos-aarch64/
          cp deploy/install-daemon.sh dist/coda-daemon-macos-aarch64/

          tar -C dist -czf dist/coda-macos-aarch64.tar.gz coda-macos-aarch64
          tar -C dist -czf dist/coda-daemon-macos-aarch64.tar.gz coda-daemon-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-artifacts
          path: |
            dist/coda-macos-aarch64.tar.gz
            dist/coda-daemon-macos-aarch64.tar.gz

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Coda ${{ github.ref_name }} · Zero-Knowledge AI Agent Mesh (GPUI + SwiftUI + E2EE)"
          body_path: deploy/DEPLOY.md
          draft: false
          prerelease: false
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS.txt
