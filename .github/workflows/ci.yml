name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
      web: ${{ steps.filter.outputs.web }}
      rust_core: ${{ steps.filter.outputs.rust_core }}
      apple_desktop: ${{ steps.filter.outputs.apple_desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deploy:
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
            rust_core:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'migrations/**'
              - 'crates/coda-protocol/**'
              - 'crates/coda-herdr/**'
              - 'crates/coda-daemon/**'
              - 'crates/coda-server/**'
            apple_desktop:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/coda-protocol/**'
              - 'crates/coda-desktop/**'
              - 'crates/coda-apple-ffi/**'
              - 'apple/**'

  deploy-lint:
    name: Deploy Scripts & Compose Check
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts & Docker Compose config
        run: |
          for f in deploy/*.sh; do
            sh -n "$f"
          done
          docker compose -f deploy/docker-compose.yml config >/dev/null
          docker compose --profile relay-cn -f deploy/docker-compose.yml config >/dev/null

  web-console:
    name: Web Console Build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install & Build Web Console
        run: cd web && bun install && bun run build

  rust-core:
    name: Rust Core (Protocol, Herdr, Daemon & Server)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust_core == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vampire
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: coda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vampire -d coda_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libzstd-dev
      - name: Build & test protocol, herdr, daemon, and server
        env:
          TEST_DATABASE_URL: postgres://vampire@localhost:5432/coda_test
        run: |
          cargo test -p coda-protocol -p coda-herdr -p coda-daemon -p coda-server -- --nocapture

  macos-gpui-and-apple:
    name: macOS (GPUI Desktop + Apple Swift 6)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.apple_desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test GPUI Desktop Client (Metal runtime_shaders)
        run: |
          cargo test -p coda-desktop
          cargo run -p coda-desktop -- --self-test
      - name: Build & Self-Test Apple Swift 6 Package
        run: cd apple && swift build && swift run CodaSelfTest
