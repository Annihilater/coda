<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coda — 端到端零知识加密的跨设备 AI 编程工作台</title>
  <meta name="description" content="Coda 将你的 Linux 云服务器、Mac 桌面工作站与随身 iPhone/Web 接入同一个零知识加密网络。常驻 herdr-core 守护、Wi-Fi 毫秒级直连、Cloudflare Tunnel 零公网端口暴露。" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #0b0c0e;
      --surface: #111317;
      --raised: #171a20;
      --sidebar: #0e1014;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.14);
      --fg: #f3f4f6;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --faint: #6b7280;
      --brand-amber: #f59e0b;
      --brand-orange: #e06c50;
      --coral: #e06c50;
      --emerald: #22c55e;
      --running: #22c55e;
      --sky: #38bdf8;
      --rose: #fb7185;
      --border: #24262e;
      --surface-hover: #22252e;
      --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body, #app {
      min-height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button, input { font: inherit; color: inherit; }
    .coda-mono { font-family: var(--mono); font-variant-ligatures: none; }

    /* ================= Highwind-Inspired Landing Page ================= */
    .hw-page {
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      overflow-x: clip;
    }
    .hw-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid var(--line);
      background: rgba(11, 12, 14, 0.82);
      backdrop-filter: blur(18px) saturate(160%);
    }
    .hw-nav-inner {
      max-width: 1152px;
      margin: 0 auto;
      height: 58px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .hw-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .hw-nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
    }
    .hw-nav-links a {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .hw-nav-links a:hover { color: var(--fg); }
    @media (max-width: 820px) {
      .hw-nav-links { display: none; }
    }
    .hw-container {
      max-width: 1152px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .hw-hero {
      position: relative;
      padding: 72px 0 40px;
    }
    .hw-hero-glow {
      position: absolute;
      inset: 0 0 auto 0;
      height: 560px;
      pointer-events: none;
      background: radial-gradient(58% 48% at 50% 0%, rgba(245, 158, 11, 0.12) 0%, rgba(224, 108, 80, 0.05) 45%, transparent 100%);
    }
    .hw-hero-head {
      position: relative;
      max-width: 780px;
      margin: 0 auto;
      text-align: center;
    }
    .hw-eyebrow {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .hw-h1 {
      margin-top: 18px;
      font-size: clamp(34px, 5.4vw, 60px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.035em;
      color: #ffffff;
    }
    .hw-lead {
      margin: 22px auto 0;
      max-width: 660px;
      font-size: 17px;
      line-height: 1.65;
      color: var(--muted);
    }
    .hw-cta-row {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .hw-cmd-pill {
      margin: 20px auto 0;
      max-width: 660px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px 10px 16px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
    }
    .hw-cmd-pill code {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--emerald);
      word-break: break-all;
      text-align: left;
    }
    .hw-subhint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--faint);
    }

    /* Interactive 3-Pane Mac App Showcase Window */
    .hw-window {
      margin-top: 52px;
      border-radius: 16px;
      border: 1px solid var(--line-strong);
      background: #111216;
      box-shadow: 0 40px 120px -24px rgba(0, 0, 0, 0.85);
      overflow: hidden;
    }
    .hw-win-top {
      height: 38px;
      padding: 0 14px;
      background: #141519;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .hw-traffic { display: flex; gap: 7px; align-items: center; }
    .hw-traffic span { width: 11px; height: 11px; border-radius: 99px; display: inline-block; }
    .hw-win-tabs { display: flex; gap: 6px; overflow-x: auto; }
    .hw-win-tab {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: var(--mono);
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .hw-win-tab.active {
      background: #1f222a;
      border-color: var(--line-strong);
      color: var(--fg);
    }
    .hw-win-grid {
      display: grid;
      grid-template-columns: 235px minmax(0, 1.15fr) minmax(0, 1fr);
      min-height: 410px;
    }
    @media (max-width: 960px) {
      .hw-win-grid { grid-template-columns: 1fr; }
    }
    .hw-win-col {
      padding: 12px;
      border-right: 1px solid var(--line);
    }
    .hw-win-col:last-child { border-right: none; }
    .hw-win-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--faint);
      margin: 10px 0 6px;
    }
    .hw-win-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: #d1d5db;
    }
    .hw-win-item.active { background: #1e2128; color: #fff; }
    .hw-win-status {
      height: 28px;
      padding: 0 14px;
      background: #141519;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    /* Editorial Sections */
    .hw-section { padding: 96px 0 0; }
    .hw-sec-eyebrow {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--faint);
    }
    .hw-h2 {
      margin-top: 10px;
      font-size: clamp(28px, 3.8vw, 42px);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.03em;
      color: #ffffff;
    }
    .hw-sec-sub {
      margin-top: 14px;
      max-width: 640px;
      font-size: 16px;
      line-height: 1.65;
      color: var(--muted);
    }
    .hw-splits {
      margin-top: 56px;
      display: flex;
      flex-direction: column;
      gap: 72px;
    }
    .hw-split {
      display: grid;
      grid-template-columns: 5fr 7fr;
      gap: 44px;
      align-items: center;
    }
    .hw-split.rev > :first-child { order: 2; }
    .hw-split.rev > :last-child { order: 1; }
    @media (max-width: 900px) {
      .hw-split { grid-template-columns: 1fr; gap: 24px; }
      .hw-split.rev > :first-child, .hw-split.rev > :last-child { order: initial; }
    }
    .hw-h3 {
      margin-top: 10px;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.18;
      letter-spacing: -0.025em;
    }
    .hw-split-copy {
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.7;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hw-card-frame {
      border-radius: 14px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      overflow: hidden;
      box-shadow: 0 24px 64px -24px rgba(0, 0, 0, 0.85);
    }
    .hw-card-bar {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--faint);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hw-kbd {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid var(--line-strong);
      background: var(--raised);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg);
    }
    .hw-principles {
      margin-top: 64px;
      padding-top: 36px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
    }
    @media (max-width: 760px) {
      .hw-principles { grid-template-columns: 1fr; }
    }

    /* Comparison Table */
    .hw-table-wrap {
      margin-top: 32px;
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .hw-table {
      width: 100%;
      min-width: 780px;
      border-collapse: collapse;
      font-size: 13px;
    }
    .hw-table th, .hw-table td {
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      text-align: center;
    }
    .hw-table th:first-child, .hw-table td:first-child {
      text-align: left;
      padding-left: 16px;
      font-weight: 600;
      width: 170px;
    }
    .hw-table thead th {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      background: #14161b;
    }
    .hw-table tr.is-coda {
      background: rgba(245, 158, 11, 0.08);
    }
    .hw-table tr.is-coda td:first-child { color: var(--brand-amber); }
    .hw-dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 99px;
      background: var(--running);
    }
    .hw-dash { color: var(--faint); font-family: var(--mono); }

    /* Download Grid & Auth Panels */
    .dl-grid {
      margin-top: 32px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    @media (max-width: 820px) {
      .dl-grid { grid-template-columns: 1fr; }
    }
    .dl-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .portal-auth-grid {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }
    .portal-panel {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      padding: 24px;
    }
    .hw-footer {
      margin-top: 88px;
      padding: 28px 0 44px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13px;
      color: var(--faint);
    }

    /* Buttons & Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--line-strong);
      background: var(--raised);
      color: #d4d4d8;
    }
    .btn-primary {
      background: #f3f4f6;
      color: #09090b;
      border: none;
      border-radius: 9px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #ffffff; }
    .btn-ghost {
      background: var(--raised);
      color: #e4e4e7;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-ghost:hover { background: #22262f; border-color: rgba(255,255,255,0.25); }

    /* ================= Logged-in Web Console ================= */
    .shell-root {
      display: flex;
      height: 100vh;
      width: 100vw;
      background: #0b0c0f;
      overflow: hidden;
    }
    .left-sidebar {
      width: 280px;
      background: #111216;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .circle-btn {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: var(--raised);
      border: 1px solid var(--line-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .circle-btn:hover { background: var(--surface-hover); }
    .branch-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid transparent;
      margin-bottom: 4px;
    }
    .branch-item:hover { background: rgba(255,255,255,0.03); }
    .branch-item.active {
      background: #1b1d24;
      border-color: var(--line-strong);
    }
    .main-terminal-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px 10px;
      background: #0b0c0f;
    }
    .term-viewport {
      flex: 1;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.62;
      padding: 10px 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: #e4e4e7;
    }
    .cursor-box {
      display: inline-block;
      border: 1.5px solid #f4f4f5;
      min-width: 9px;
      padding: 0 1px;
      line-height: 1.1;
    }
    .desktop-composer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #14161b;
      border: 1px solid var(--line-strong);
    }
    .desktop-composer-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .desktop-composer-inp {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--mono);
      font-size: 13px;
      color: #f3f4f6;
    }
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 6px;
      height: 98px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 13px;
    }
    .keypad-left {
      grid-column: span 10 / span 10;
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .keypad-row {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 6px;
    }
    .k-btn {
      background: var(--raised);
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .k-btn:hover { background: var(--surface-hover); }
    .k-enter {
      grid-column: span 2 / span 2;
      background: #f4f4f5;
      color: #09090b;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .right-rail {
      width: 56px;
      background: #111216;
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 6px;
      flex-shrink: 0;
    }
    .rail-capsule {
      background: var(--raised);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      width: 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 12px;
    }
    .rail-capsule button { background: none; border: none; cursor: pointer; font-size: 15px; }
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }
    .modal-card {
      width: 440px;
      max-width: 92vw;
      background: #12141a;
      border: 1px solid var(--line-strong);
      border-radius: 18px;
      padding: 22px;
    }
    .inp {
      width: 100%;
      background: #090a0d;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 13px;
      margin-top: 6px;
      margin-bottom: 12px;
      outline: none;
    }
    .inp:focus { border-color: var(--emerald); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
