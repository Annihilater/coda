name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.3.7)"
        required: true
        default: "v0.3.7"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64 (Server + Daemon + Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-linux-x86_64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install build dependencies
        run: dpkg -s pkg-config libzstd-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libzstd-dev)
      - name: Build Web Console
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Build coda-server & coda-daemon (release)
        run: cargo build --release -p coda-server -p coda-daemon
      - name: Package Linux x86_64 Artifacts
        run: |
          mkdir -p dist/coda-server-linux-x86_64 dist/coda-daemon-linux-x86_64
          cp target/release/coda-server dist/coda-server-linux-x86_64/
          cp -r web/dist dist/coda-server-linux-x86_64/web-dist
          cp -r migrations dist/coda-server-linux-x86_64/migrations
          cp -r deploy dist/coda-server-linux-x86_64/deploy
          cp README.md dist/coda-server-linux-x86_64/

          cp target/release/coda-daemon dist/coda-daemon-linux-x86_64/
          cp deploy/install-daemon.sh dist/coda-daemon-linux-x86_64/

          COMPRESS="gzip -1"
          if command -v pigz >/dev/null 2>&1; then
            COMPRESS="pigz -1"
          fi
          tar --owner=0 --group=0 -C dist -I "${COMPRESS}" -cf "dist/coda-server-linux-x86_64-${RELEASE_TAG}.tar.gz" coda-server-linux-x86_64
          tar --owner=0 --group=0 -C dist -I "${COMPRESS}" -cf "dist/coda-daemon-linux-x86_64-${RELEASE_TAG}.tar.gz" coda-daemon-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: coda-rel-linux-x86_64
          retention-days: 1
          path: |
            dist/*.tar.gz

  build-linux-aarch64:
    name: Build Linux ARM64 (Server + Daemon)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-linux-aarch64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install build dependencies
        run: dpkg -s pkg-config libzstd-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libzstd-dev)
      - name: Build Web Console
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Build coda-server & coda-daemon (release)
        run: cargo build --release -p coda-server -p coda-daemon
      - name: Package Linux aarch64
        run: |
          mkdir -p dist/coda-server-linux-aarch64 dist/coda-daemon-linux-aarch64
          cp target/release/coda-server dist/coda-server-linux-aarch64/
          cp -r web/dist dist/coda-server-linux-aarch64/web-dist
          cp -r migrations dist/coda-server-linux-aarch64/migrations
          cp -r deploy dist/coda-server-linux-aarch64/deploy
          cp README.md dist/coda-server-linux-aarch64/

          cp target/release/coda-daemon dist/coda-daemon-linux-aarch64/
          cp deploy/install-daemon.sh dist/coda-daemon-linux-aarch64/

          COMPRESS="gzip -1"
          if command -v pigz >/dev/null 2>&1; then
            COMPRESS="pigz -1"
          fi
          tar --owner=0 --group=0 -C dist -I "${COMPRESS}" -cf "dist/coda-server-linux-aarch64-${RELEASE_TAG}.tar.gz" coda-server-linux-aarch64
          tar --owner=0 --group=0 -C dist -I "${COMPRESS}" -cf "dist/coda-daemon-linux-aarch64-${RELEASE_TAG}.tar.gz" coda-daemon-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: coda-rel-linux-aarch64
          retention-days: 1
          path: |
            dist/*.tar.gz

  build-macos-aarch64:
    name: Build macOS Apple Silicon (GPUI Desktop + Daemon + Server + SwiftUI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-macos-aarch64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore Swift Release Build Cache
        uses: actions/cache/restore@v4
        with:
          path: apple/.build
          key: swift-release-macos-aarch64-${{ hashFiles('apple/Package.swift', 'apple/Sources/**', 'apple/Tests/**') }}
          restore-keys: |
            swift-release-macos-aarch64-
      - name: Build Web Console
        run: cd web && bun install --frozen-lockfile && bun run build
      - name: Build Rust Release Binaries (coda-desktop GPUI + coda-daemon + coda-server)
        run: cargo build --release -p coda-server -p coda-daemon -p coda-desktop
      - name: Build Apple Swift 6 Desktop Companion
        run: cd apple && swift build -c release --product CodaMacApp
      - name: Package macOS Apple Silicon Suite
        run: |
          mkdir -p dist/coda-macos-aarch64 dist/coda-daemon-macos-aarch64
          cp target/release/coda-desktop dist/coda-macos-aarch64/
          cp target/release/coda-daemon dist/coda-macos-aarch64/
          cp target/release/coda-server dist/coda-macos-aarch64/
          cp apple/.build/release/CodaMacApp dist/coda-macos-aarch64/
          cp -r web/dist dist/coda-macos-aarch64/web-dist
          cp -r deploy dist/coda-macos-aarch64/deploy
          cp README.md dist/coda-macos-aarch64/

          cp target/release/coda-daemon dist/coda-daemon-macos-aarch64/
          cp deploy/install-daemon.sh dist/coda-daemon-macos-aarch64/

          COPYFILE_DISABLE=1 tar -C dist -czf "dist/coda-macos-aarch64-${RELEASE_TAG}.tar.gz" coda-macos-aarch64 &
          PID_TAR1=$!
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/coda-daemon-macos-aarch64-${RELEASE_TAG}.tar.gz" coda-daemon-macos-aarch64 &
          PID_TAR2=$!

          DMG_STAGE="dist-dmg"
          APP_DIR="${DMG_STAGE}/Coda.app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
          cp target/release/coda-desktop "${APP_DIR}/Contents/MacOS/coda-desktop"
          cp target/release/coda-daemon "${APP_DIR}/Contents/MacOS/coda-daemon"
          chmod +x "${APP_DIR}/Contents/MacOS/coda-desktop" "${APP_DIR}/Contents/MacOS/coda-daemon"
          swift assets/render_icon.swift --icns "${APP_DIR}/Contents/Resources/AppIcon.icns"
          SHORT_VER="${RELEASE_TAG#v}"
          cat > "${APP_DIR}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>coda-desktop</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIdentifier</key><string>dev.codahub.desktop</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>Coda</string>
            <key>CFBundleDisplayName</key><string>Coda</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${SHORT_VER}</string>
            <key>CFBundleVersion</key><string>${SHORT_VER}</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          ln -s /Applications "${DMG_STAGE}/Applications"
          codesign --force --deep --sign - "${APP_DIR}"
          hdiutil create -volname "Coda Desktop ${RELEASE_TAG}" -srcfolder "${DMG_STAGE}" -ov -format UDZO -imagekey zlib-level=1 "dist/Coda-Desktop-macos-aarch64-${RELEASE_TAG}.dmg"
          wait "${PID_TAR1}"
          wait "${PID_TAR2}"
      - uses: actions/upload-artifact@v4
        with:
          name: coda-rel-macos-aarch64
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.dmg

  build-and-push-docker:
    name: Build & Push Multi-Arch GHCR + Offline Docker Tarballs
    needs: [build-linux-x86_64, build-linux-aarch64]
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coda-rel-linux-*
          path: linux-assets
          merge-multiple: true

      - name: Set up QEMU & Docker Buildx
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Multi-Arch Docker Build Context
        run: |
          mkdir -p docker-ctx/bin/linux-amd64 docker-ctx/bin/linux-arm64 docker-ctx/web docker-ctx/deploy dist-unpack dist-images
          tar -C dist-unpack -xzf "linux-assets/coda-server-linux-x86_64-${RELEASE_TAG}.tar.gz"
          tar -C dist-unpack -xzf "linux-assets/coda-daemon-linux-x86_64-${RELEASE_TAG}.tar.gz"
          tar -C dist-unpack -xzf "linux-assets/coda-server-linux-aarch64-${RELEASE_TAG}.tar.gz"
          tar -C dist-unpack -xzf "linux-assets/coda-daemon-linux-aarch64-${RELEASE_TAG}.tar.gz"

          cp dist-unpack/coda-server-linux-x86_64/coda-server docker-ctx/bin/linux-amd64/coda-server
          cp dist-unpack/coda-daemon-linux-x86_64/coda-daemon docker-ctx/bin/linux-amd64/coda-daemon
          cp dist-unpack/coda-server-linux-aarch64/coda-server docker-ctx/bin/linux-arm64/coda-server
          cp dist-unpack/coda-daemon-linux-aarch64/coda-daemon docker-ctx/bin/linux-arm64/coda-daemon
          cp -r dist-unpack/coda-server-linux-x86_64/web-dist docker-ctx/web/dist
          cp deploy/install-daemon.sh docker-ctx/deploy/install-daemon.sh

          sed 's/^          //' > docker-ctx/Dockerfile <<'DOCKERFILE_EOF'
          FROM debian:bookworm-slim
          ARG TARGETARCH
          LABEL org.opencontainers.image.source="https://github.com/Annihilater/coda"
          LABEL org.opencontainers.image.description="Coda Zero-Knowledge AI Agent Mesh Coordinator & Stateless Relay"
          LABEL org.opencontainers.image.licenses="MIT"
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libzstd1 && rm -rf /var/lib/apt/lists/*
          WORKDIR /opt/coda
          COPY bin/linux-${TARGETARCH}/coda-server /usr/local/bin/coda-server
          COPY bin/linux-${TARGETARCH}/coda-daemon /usr/local/bin/coda-daemon
          COPY web/dist /opt/coda/web/dist
          COPY deploy/install-daemon.sh /opt/coda/deploy/install-daemon.sh
          EXPOSE 8080 24443
          ENTRYPOINT ["coda-server"]
          CMD ["--web-dist", "/opt/coda/web/dist"]
          DOCKERFILE_EOF

      - name: Push Multi-Arch Image to ghcr.io/annihilater/coda
        uses: docker/build-push-action@v6
        with:
          context: docker-ctx
          file: docker-ctx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/annihilater/coda:buildcache
          cache-to: type=registry,ref=ghcr.io/annihilater/coda:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          tags: |
            ghcr.io/annihilater/coda:${{ env.RELEASE_TAG }}
            ghcr.io/annihilater/coda:latest

      - name: Export Offline Container Image Tarballs in Parallel
        run: |
          GZIP_BIN="gzip"
          if command -v pigz >/dev/null 2>&1; then
            GZIP_BIN="pigz"
          fi
          docker buildx build --platform linux/amd64 \
            --cache-from type=registry,ref=ghcr.io/annihilater/coda:buildcache \
            -t "ghcr.io/annihilater/coda:${RELEASE_TAG}" \
            --output type=docker,dest=- docker-ctx \
            | "${GZIP_BIN}" -1 > "dist-images/coda-image-linux-amd64-${RELEASE_TAG}.tar.gz" &
          PID_AMD64=$!

          docker buildx build --platform linux/arm64 \
            --cache-from type=registry,ref=ghcr.io/annihilater/coda:buildcache \
            -t "ghcr.io/annihilater/coda:${RELEASE_TAG}" \
            --output type=docker,dest=- docker-ctx \
            | "${GZIP_BIN}" -1 > "dist-images/coda-image-linux-arm64-${RELEASE_TAG}.tar.gz" &
          PID_ARM64=$!

          wait "${PID_AMD64}"
          wait "${PID_ARM64}"

      - uses: actions/upload-artifact@v4
        with:
          name: coda-rel-docker-images
          retention-days: 1
          path: dist-images/*.tar.gz

  publish-github-release:
    name: Assemble Deploy Bundle & Publish GitHub Release
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-aarch64, build-and-push-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: dl
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: coda-rel-*
          path: release-assets
          merge-multiple: true
      - name: Fallback Artifact Download via gh CLI
        if: steps.dl.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf release-assets release-assets-raw
          mkdir -p release-assets-raw release-assets
          gh run download "${GITHUB_RUN_ID}" --pattern "coda-rel-*" --dir release-assets-raw
          find release-assets-raw -type f \( -name "*.tar.gz" -o -name "*.dmg" \) -exec mv {} release-assets/ \;

      - name: Assemble Clean coda-deploy-bundle (No Dockerfile, Prebuilt Image + Lifecycle Scripts)
        run: |
          BUNDLE_DIR="dist-bundle/coda-deploy-bundle"
          mkdir -p "${BUNDLE_DIR}"

          cp deploy/DEPLOY.md "${BUNDLE_DIR}/DEPLOY.md"
          cp README.md "${BUNDLE_DIR}/README.md"
          cp -r migrations "${BUNDLE_DIR}/migrations"

          cp deploy/coda-server.service "${BUNDLE_DIR}/coda-server.service"
          cp deploy/coda-relay-cn.service "${BUNDLE_DIR}/coda-relay-cn.service"

          sed "s|ghcr.io/annihilater/coda:latest|ghcr.io/annihilater/coda:${RELEASE_TAG}|g" \
            deploy/.env.example > "${BUNDLE_DIR}/.env.example"
          cp "${BUNDLE_DIR}/.env.example" "${BUNDLE_DIR}/env.example"
          sed "s|ghcr.io/annihilater/coda:latest|ghcr.io/annihilater/coda:${RELEASE_TAG}|g" \
            deploy/docker-compose.yml > "${BUNDLE_DIR}/docker-compose.yml"

          for s in pull.sh start.sh stop.sh restart.sh status.sh logs.sh update.sh install-server.sh install-relay-cn.sh install-daemon.sh; do
            cp "deploy/${s}" "${BUNDLE_DIR}/${s}"
            chmod 0755 "${BUNDLE_DIR}/${s}"
          done
          sed "s|ghcr.io/annihilater/coda:latest|ghcr.io/annihilater/coda:${RELEASE_TAG}|g" \
            deploy/coda.sh > "${BUNDLE_DIR}/coda.sh"
          chmod 0755 "${BUNDLE_DIR}/coda.sh"
          chmod 0644 "${BUNDLE_DIR}/.env.example" "${BUNDLE_DIR}/env.example" "${BUNDLE_DIR}/docker-compose.yml" "${BUNDLE_DIR}/coda-server.service" "${BUNDLE_DIR}/coda-relay-cn.service"

          tar --owner=0 --group=0 -C dist-bundle -czf "release-assets/coda-deploy-bundle-${RELEASE_TAG}.tar.gz" coda-deploy-bundle

      - name: Create Unversioned Latest Asset Aliases & Generate SHA256SUMS
        run: |
          cd release-assets
          cp "Coda-Desktop-macos-aarch64-${RELEASE_TAG}.dmg" "Coda-Desktop-macos-aarch64.dmg"
          cp "coda-macos-aarch64-${RELEASE_TAG}.tar.gz" "coda-macos-aarch64.tar.gz"
          cp "coda-daemon-linux-x86_64-${RELEASE_TAG}.tar.gz" "coda-daemon-linux-x86_64.tar.gz"
          cp "coda-daemon-linux-aarch64-${RELEASE_TAG}.tar.gz" "coda-daemon-linux-aarch64.tar.gz"
          cp "coda-daemon-macos-aarch64-${RELEASE_TAG}.tar.gz" "coda-daemon-macos-aarch64.tar.gz"
          cp "coda-server-linux-x86_64-${RELEASE_TAG}.tar.gz" "coda-server-linux-x86_64.tar.gz"
          cp "coda-server-linux-aarch64-${RELEASE_TAG}.tar.gz" "coda-server-linux-aarch64.tar.gz"
          cp "coda-deploy-bundle-${RELEASE_TAG}.tar.gz" "coda-deploy-bundle.tar.gz"
          sha256sum *.tar.gz *.dmg > "SHA256SUMS-${RELEASE_TAG}.txt"
          cp "SHA256SUMS-${RELEASE_TAG}.txt" "SHA256SUMS.txt"
          cat "SHA256SUMS-${RELEASE_TAG}.txt"

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Coda ${{ env.RELEASE_TAG }} · Zero-Knowledge AI Agent Mesh (GPUI + SwiftUI + E2EE)"
          body_path: deploy/DEPLOY.md
          draft: false
          prerelease: false
          files: |
            release-assets/*.tar.gz
            release-assets/*.dmg
            release-assets/SHA256SUMS*.txt
