name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
      web: ${{ steps.filter.outputs.web }}
      rust_core: ${{ steps.filter.outputs.rust_core }}
      apple_desktop: ${{ steps.filter.outputs.apple_desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deploy:
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            rust_core:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'migrations/**'
              - 'crates/coda-protocol/**'
              - 'crates/coda-herdr/**'
              - 'crates/coda-daemon/**'
              - 'crates/coda-server/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            apple_desktop:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/coda-protocol/**'
              - 'crates/coda-desktop/**'
              - 'crates/coda-apple-ffi/**'
              - 'apple/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  deploy-lint:
    name: Deploy Scripts & Compose Check
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts & Docker Compose config
        run: |
          for f in deploy/*.sh; do
            sh -n "$f"
          done
          docker compose -f deploy/docker-compose.yml config >/dev/null
          docker compose --profile relay-cn -f deploy/docker-compose.yml config >/dev/null

  web-console:
    name: Web Console Build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install & Build Web Console
        run: cd web && bun install --frozen-lockfile && bun run build

  rust-core:
    name: Rust Core (Linux x86_64 Release Cache & Tests)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust_core == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vampire
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: coda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vampire -d coda_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-linux-x86_64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install system dependencies
        run: dpkg -s pkg-config libzstd-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libzstd-dev)
      - name: Build & test protocol, herdr, daemon, and server (release)
        env:
          TEST_DATABASE_URL: postgres://vampire@localhost:5432/coda_test
        run: |
          cargo test --release -p coda-protocol -p coda-herdr -p coda-daemon -p coda-server -- --nocapture
          cargo build --release -p coda-server -p coda-daemon

  rust-linux-arm64:
    name: Rust Release Cache Warm (Linux ARM64)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust_core == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-linux-aarch64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install system dependencies
        run: dpkg -s pkg-config libzstd-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libzstd-dev)
      - name: Build release binaries to warm ARM64 cache
        run: cargo build --release -p coda-server -p coda-daemon

  macos-gpui-and-apple:
    name: macOS (GPUI Desktop + Apple Swift 6 Release Cache & Tests)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.apple_desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-macos-aarch64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Cache Swift Release Build
        uses: actions/cache@v4
        with:
          path: apple/.build
          key: swift-release-macos-aarch64-${{ hashFiles('apple/Package.swift', 'apple/Sources/**', 'apple/Tests/**') }}
          restore-keys: |
            swift-release-macos-aarch64-
      - name: Test & Build GPUI Desktop + Daemon + Server (release)
        run: |
          cargo test --release -p coda-desktop
          cargo build --release -p coda-server -p coda-daemon -p coda-desktop
          ./target/release/coda-desktop --self-test
      - name: Build & Self-Test Apple Swift 6 Package (release)
        run: cd apple && swift build -c release && ./.build/release/CodaSelfTest
