<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coda — Zero-Knowledge Cross-Device AI Coding Workbench</title>
  <meta id="meta-desc" name="description" content="Connect your Linux servers, macOS workstation, and iPhone/Web into one zero-knowledge encrypted mesh. Persistent herdr-core PTYs, sub-millisecond LAN P2P, and zero exposed ports via Cloudflare Tunnel." />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
  <script>
    (function () {
      try {
        var pref = localStorage.getItem("coda_theme") || "dark";
        var resolved = pref === "system"
          ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : (pref === "light" ? "light" : "dark");
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
        var qLang = new URLSearchParams(window.location.search).get("lang");
        var loc = (qLang === "zh" || qLang === "zh-CN") ? "zh" : (qLang === "en" ? "en" : (localStorage.getItem("coda_locale") === "zh" ? "zh" : "en"));
        document.documentElement.lang = loc === "zh" ? "zh-CN" : "en";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.lang = "en";
      }
    })();
  </script>
  <style>
    :root,
    [data-theme="dark"] {
      --bg-canvas: #000000;
      --bg-surface: #09090b;
      --bg-card: #111113;
      --bg-elevated: #18181b;
      --bg-hover: #222226;
      --bg-input: #141416;
      --nav-glass: rgba(0, 0, 0, 0.78);

      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --text-quaternary: #52525b;

      --border-primary: #222226;
      --border-secondary: #18181b;
      --border-strong: #323238;
      --border-dashed: rgba(255, 255, 255, 0.11);

      --fill-primary: #ffffff;
      --on-fill-primary: #09090b;

      --bento-tray: #0a0a0c;
      --bento-card: #121215;
      --bento-card-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 12px 32px rgba(0, 0, 0, 0.48);

      --emerald: #22c55e;
      --emerald-bg: rgba(34, 197, 94, 0.12);
      --emerald-bd: rgba(34, 197, 94, 0.28);
      --signal-blue: #3b82f6;
      --signal-blue-bg: rgba(59, 130, 246, 0.12);
      --signal-blue-bd: rgba(59, 130, 246, 0.28);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.12);
      --amber-bd: rgba(245, 158, 11, 0.28);
      --coral: #e06c50;
      --rose: #ef4444;
      --rose-bg: rgba(239, 68, 68, 0.12);
      --rose-bd: rgba(239, 68, 68, 0.28);

      --sans: "InterVariable", "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      --mono: "Geist Mono", "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    }

    [data-theme="light"] {
      --bg-canvas: #f7f7f5;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --bg-elevated: #f4f4f5;
      --bg-hover: #e4e4e7;
      --bg-input: #fbfbfa;
      --nav-glass: rgba(247, 247, 245, 0.84);

      --text-primary: #09090b;
      --text-secondary: #52525b;
      --text-tertiary: #71717a;
      --text-quaternary: #a1a1aa;

      --border-primary: #e4e4e7;
      --border-secondary: #eeeeec;
      --border-strong: #d4d4d8;
      --border-dashed: rgba(20, 20, 22, 0.11);

      --fill-primary: #141416;
      --on-fill-primary: #ffffff;

      --bento-tray: #eeeeea;
      --bento-card: #ffffff;
      --bento-card-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 18px 50px rgba(20, 20, 40, 0.08);

      --emerald: #16a34a;
      --emerald-bg: rgba(22, 163, 74, 0.1);
      --emerald-bd: rgba(22, 163, 74, 0.26);
      --signal-blue: #2f5bff;
      --signal-blue-bg: #eef2ff;
      --signal-blue-bd: rgba(47, 91, 255, 0.24);
      --amber: #d97706;
      --amber-bg: rgba(217, 119, 6, 0.1);
      --amber-bd: rgba(217, 119, 6, 0.26);
      --coral: #d95a3a;
      --rose: #dc2626;
      --rose-bg: rgba(220, 38, 38, 0.09);
      --rose-bd: rgba(220, 38, 38, 0.24);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body, #app {
      min-height: 100%;
      width: 100%;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--sans);
      font-feature-settings: "cv11", "ss01";
      -webkit-font-smoothing: antialiased;
      transition: background-color 240ms cubic-bezier(0.22, 1, 0.36, 1),
                  color 200ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }
    code {
      font-family: var(--mono);
      font-variant-ligatures: none;
      font-size: 0.88em;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-primary);
    }
    .coda-mono {
      font-family: var(--mono);
      font-variant-ligatures: none;
      font-variant-numeric: tabular-nums;
    }
    .pm-num { font-variant-numeric: tabular-nums; }
    .pm-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ================= Palermo Architectural Layout ================= */
    .pm-page {
      min-height: 100vh;
      background: var(--bg-canvas);
      color: var(--text-primary);
      overflow-x: clip;
    }

    .pm-topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 56px;
      border-bottom: 1px solid var(--border-primary);
      background: var(--nav-glass);
      backdrop-filter: blur(16px) saturate(160%);
      transition: background-color 240ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .pm-topbar-inner {
      max-width: 1180px;
      height: 100%;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .pm-topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .pm-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.02em;
      flex-shrink: 0;
    }
    .pm-vsep {
      width: 1px;
      height: 18px;
      background: var(--border-primary);
      flex-shrink: 0;
    }
    .pm-nav-pills {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .pm-nav-link {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-tertiary);
      padding: 6px 9px;
      border-radius: 7px;
      transition: color 0.16s, background-color 0.16s;
      white-space: nowrap;
    }
    .pm-nav-link:hover {
      color: var(--text-primary);
      background: var(--bg-elevated);
    }
    .pm-topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .pm-cmd-trigger {
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-primary);
      color: var(--text-tertiary);
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.16s, color 0.16s;
    }
    .pm-cmd-trigger:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .pm-kbd {
      font-family: var(--mono);
      font-size: 10.5px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-primary);
      color: var(--text-secondary);
    }
    .pm-theme-group {
      height: 32px;
      padding: 2px;
      border-radius: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-primary);
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .pm-theme-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.16s, color 0.16s;
    }
    .pm-theme-btn:hover { color: var(--text-primary); }
    .pm-theme-btn.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      box-shadow: 0 0 0 1px var(--border-primary);
    }
    .pm-lang-group {
      height: 32px;
      padding: 2px;
      border-radius: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-primary);
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }
    .pm-lang-btn {
      height: 26px;
      padding: 0 7px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.16s, color 0.16s;
      white-space: nowrap;
    }
    .pm-lang-btn:hover { color: var(--text-primary); }
    .pm-lang-btn.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      box-shadow: 0 0 0 1px var(--border-primary);
    }
    @media (max-width: 1140px) {
      .pm-cmd-label { display: none; }
    }
    @media (max-width: 1000px) {
      .pm-nav-pills, .pm-vsep, .pm-cmd-trigger { display: none; }
    }
    @media (max-width: 600px) {
      .pm-topbar-inner { padding: 0 14px; }
      #btn-nav-login { display: none; }
    }

    /* Section Band & Dashed Architectural Side Rails */
    .pm-band {
      border-bottom: 1px solid var(--border-primary);
      transition: border-color 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .pm-rail {
      max-width: 1120px;
      margin: 0 auto;
      padding: 56px 28px;
      border-left: 1px dashed var(--border-dashed);
      border-right: 1px dashed var(--border-dashed);
    }
    .pm-rail.compact { padding: 36px 28px; }
    @media (max-width: 760px) {
      .pm-rail { padding: 40px 16px; border-left: none; border-right: none; }
      .pm-rail.compact { padding: 28px 16px; }
    }

    /* Corner Drafting Frame */
    .pm-frame {
      position: relative;
      border: 1px solid var(--border-primary);
      background: var(--bg-surface);
      transition: background-color 240ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .pm-corner {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-strong);
      pointer-events: none;
      z-index: 2;
    }
    .pm-corner.tl { top: -3px; left: -3px; }
    .pm-corner.tr { top: -3px; right: -3px; }
    .pm-corner.bl { bottom: -3px; left: -3px; }
    .pm-corner.br { bottom: -3px; right: -3px; }

    /* Palermo Buttons */
    .pm-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: background-color 0.16s, border-color 0.16s, color 0.16s, transform 0.12s;
    }
    .pm-btn:active { transform: scale(0.985); }
    .pm-btn-sm { height: 30px; padding: 0 11px; font-size: 12px; }
    .pm-btn-lg { height: 42px; padding: 0 18px; font-size: 13.5px; }
    .pm-btn-primary {
      background: var(--fill-primary);
      color: var(--on-fill-primary);
      border-color: var(--fill-primary);
    }
    .pm-btn-primary:hover { opacity: 0.9; }
    .pm-btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-primary);
    }
    .pm-btn-secondary:hover {
      background: var(--bg-elevated);
      border-color: var(--border-strong);
    }
    .pm-btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border-color: transparent;
    }
    .pm-btn-ghost:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    /* Palermo Badges */
    .pm-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: -0.01em;
      border: 1px solid var(--border-primary);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .pm-badge.green { background: var(--emerald-bg); border-color: var(--emerald-bd); color: var(--emerald); }
    .pm-badge.blue { background: var(--signal-blue-bg); border-color: var(--signal-blue-bd); color: var(--signal-blue); }
    .pm-badge.amber { background: var(--amber-bg); border-color: var(--amber-bd); color: var(--amber); }
    .pm-badge.red { background: var(--rose-bg); border-color: var(--rose-bd); color: var(--rose); }
    .pm-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      flex-shrink: 0;
    }

    /* Palermo Inputs */
    .pm-input {
      width: 100%;
      height: 40px;
      background: var(--bg-input);
      border: 1px solid var(--border-primary);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      margin-top: 6px;
      margin-bottom: 14px;
      transition: border-color 0.16s, background-color 0.16s, box-shadow 0.16s;
    }
    .pm-input:focus {
      border-color: var(--signal-blue);
      box-shadow: 0 0 0 3px var(--signal-blue-bg);
    }
    .pm-input::placeholder { color: var(--text-quaternary); }

    .pm-field {
      margin-bottom: 14px;
    }
    .pm-field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .pm-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pm-input-wrap .pm-input {
      margin-top: 0;
      margin-bottom: 0;
      padding-left: 36px;
    }
    .pm-input-wrap.has-right .pm-input {
      padding-right: 38px;
    }
    .pm-input-icon {
      position: absolute;
      left: 12px;
      color: var(--text-tertiary);
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .pm-pw-toggle {
      position: absolute;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.16s, background-color 0.16s;
    }
    .pm-pw-toggle:hover {
      color: var(--text-primary);
      background: var(--bg-elevated);
    }

    /* Hero Section with Coordinate Grid + Workbench */
    .pm-hero-band {
      position: relative;
      overflow: hidden;
    }
    .pm-grid-backdrop {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(ellipse 82% 68% at 50% 0%, #000 32%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 82% 68% at 50% 0%, #000 32%, transparent 100%);
    }
    [data-theme="light"] .pm-grid-backdrop {
      background-image:
        linear-gradient(to right, rgba(9, 9, 11, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(9, 9, 11, 0.04) 1px, transparent 1px);
    }
    .pm-hero-glow {
      position: absolute;
      top: -140px;
      left: 50%;
      transform: translateX(-50%);
      width: 780px;
      height: 300px;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.13) 0%, rgba(34, 197, 94, 0.05) 45%, transparent 75%);
      filter: blur(28px);
    }
    [data-theme="light"] .pm-hero-glow {
      background: radial-gradient(ellipse at center, rgba(47, 91, 255, 0.09) 0%, rgba(22, 163, 74, 0.04) 45%, transparent 75%);
    }
    .pm-hero-center {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pm-announce-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--border-primary);
      background: var(--bg-surface);
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 22px;
      transition: border-color 0.16s, background-color 0.16s;
    }
    .pm-announce-pill:hover {
      border-color: var(--border-strong);
      background: var(--bg-card);
    }
    .pm-hero-head {
      max-width: 820px;
    }
    .pm-hero-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .pm-h1 {
      font-size: clamp(34px, 4.6vw, 52px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.036em;
      color: var(--text-primary);
    }
    .pm-hero-sub {
      margin: 18px auto 0;
      max-width: 660px;
      font-size: 15.5px;
      line-height: 1.68;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
    }
    .pm-hero-actions {
      margin-top: 26px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .pm-install-shell {
      margin-top: 18px;
      display: inline-flex;
      max-width: 100%;
      align-items: center;
      gap: 10px;
      padding: 5px 5px 5px 12px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-primary);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset;
    }
    .pm-install-tag {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-primary);
      flex-shrink: 0;
    }
    .pm-install-shell pre {
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--text-primary);
      overflow-x: auto;
      white-space: nowrap;
    }

    /* Interactive 3-Pane Coda Workbench Window */
    .pm-workbench {
      position: relative;
      z-index: 1;
      margin-top: 40px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
    }
    [data-theme="light"] .pm-workbench {
      box-shadow: 0 24px 60px rgba(15, 15, 25, 0.09);
    }
    .pm-wb-bar {
      min-height: 44px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--border-primary);
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pm-wb-lights {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pm-wb-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
    }
    .pm-wb-tabs {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-primary);
      flex-wrap: wrap;
    }
    .pm-wb-tab {
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.16s, background-color 0.16s;
    }
    .pm-wb-tab:hover { color: var(--text-primary); }
    .pm-wb-tab.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: 0 0 0 1px var(--border-primary);
    }
    .pm-wb-grid {
      display: grid;
      grid-template-columns: 214px minmax(0, 1fr) 316px;
      background: var(--bg-surface);

        border-left: none;
        border-top: 1px solid var(--border-primary);
      }
    }
    .pm-wb-kicker {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }
    .pm-wb-tree-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text-secondary);
    }
    .pm-wb-tree-row.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-primary);
    }
    .pm-diff-box {
      border-radius: 8px;
      border: 1px solid var(--border-primary);
      background: var(--bg-canvas);
      overflow: hidden;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.6;
    }
    .pm-diff-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-primary);
      background: var(--bg-card);
      font-size: 11px;
      color: var(--text-secondary);
    }
    .pm-diff-line {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 8px;
      padding: 2px 10px;
      white-space: pre;
      overflow-x: auto;
    }
    .pm-diff-line.add {
      background: rgba(34, 197, 94, 0.09);
      color: var(--emerald);
    }
    .pm-diff-line.del {
      background: rgba(239, 68, 68, 0.09);
      color: var(--rose);
    }
    .pm-diff-line.ctx {
      color: var(--text-secondary);
    }
    .pm-diff-ln {
      color: var(--text-quaternary);
      user-select: none;
      text-align: right;
    }
    .pm-pty-box {
      border-radius: 8px;
      border: 1px solid var(--border-primary);
      background: #0a0a0c;
      color: #e4e4e7;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.65;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .pm-section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .pm-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }
    .pm-h2 {
      font-size: clamp(22px, 2.8vw, 28px);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.025em;
      color: var(--text-primary);
    }
    .pm-sub {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
      max-width: 600px;
    }

    /* ================= Bento UI Motion Grid Showcase ================= */
    .bento-tray {
      border-radius: 22px;
      padding: 10px;
      background: var(--bento-tray);
      border: 1px solid var(--border-primary);
      transition: background-color 240ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 10px;
    }
    .bento-card {
      position: relative;
      border-radius: 14px;
      padding: 16px;
      background: var(--bento-card);
      border: 1px solid var(--border-primary);
      box-shadow: var(--bento-card-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      min-height: 186px;
      overflow: hidden;
      transition: background-color 240ms cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 240ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .bento-card.is-dark {
      background: #0f0f12;
      border-color: rgba(255, 255, 255, 0.09);
      color: #ffffff;
    }
    .bento-card.is-dark .bento-muted { color: #a1a1aa; }
    .bento-card.is-dark .bento-faint { color: #71717a; }
    .bento-card.is-dark .bento-well {
      background: #17171b;
      border-color: rgba(255, 255, 255, 0.09);
    }
    .bento-card.is-dark .pm-badge:not(.green):not(.blue):not(.amber):not(.red) {
      background: #222226;
      border-color: rgba(255, 255, 255, 0.14);
      color: #d4d4d8;
    }
    .bento-span-5 { grid-column: span 5 / span 5; }
    .bento-span-4 { grid-column: span 4 / span 4; }
    .bento-span-3 { grid-column: span 3 / span 3; }
    @media (max-width: 980px) {
      .bento-span-5, .bento-span-4 { grid-column: span 6 / span 6; }
      .bento-span-3 { grid-column: span 6 / span 6; }
    }
    @media (max-width: 680px) {
      .bento-span-5, .bento-span-4, .bento-span-3 { grid-column: span 12 / span 12; }
    }
    .bento-kicker {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--text-tertiary);
    }
    .bento-card.is-dark .bento-kicker { color: #a1a1aa; }
    .bento-muted { color: var(--text-secondary); }
    .bento-faint { color: var(--text-tertiary); }
    .bento-well {
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-primary);
    }
    .bento-track {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      padding: 3px;
      border-radius: 9px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-primary);
    }
    .bento-glider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: calc(50% - 3px);
      height: calc(100% - 6px);
      border-radius: 6px;
      background: var(--bento-card);
      border: 1px solid var(--border-strong);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14);
      will-change: transform;
    }
    .bento-track-label {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 5px 4px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .bento-stack {
      position: relative;
      min-height: 22px;
    }
    .bento-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      will-change: opacity, transform;
    }
    .bento-pty-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 11.5px;
      transition: none;
      will-change: opacity, background-color;
    }
    .bento-spark-wrap {
      height: 42px;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .bento-pipe {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .bento-pipe-step {
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid var(--border-primary);
      background: var(--bg-elevated);
      font-family: var(--mono);
      font-size: 10px;
      text-align: center;
      color: var(--text-tertiary);
      will-change: border-color, color, background-color;
    }
    .bento-otp-group {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) 10px repeat(4, minmax(0, 1fr));
      align-items: center;
      gap: 5px;
    }
    .bento-otp-dash {
      text-align: center;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--text-tertiary);
    }
    .bento-otp-cell {
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--border-primary);
      background: var(--bg-elevated);
      box-shadow: 0 2px 0 var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      will-change: opacity, transform, border-color;
    }
    .bento-mesh-svg {
      width: 100%;
      height: 58px;
      display: block;
    }
    .bento-wave {
      height: 46px;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      align-items: center;
      gap: 5px;
      padding: 0 6px;
    }
    .bento-bar {
      height: 36px;
      border-radius: 999px;
      background: linear-gradient(180deg, #3b82f6 0%, #22c55e 100%);
      transform-origin: center center;
      will-change: transform, opacity;
    }
    .bento-host-tabs {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-primary);
    }
    .bento-host-tab {
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      padding: 4px 8px;
      border-radius: 5px;
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
    }
    .bento-host-tab.active {
      background: var(--bento-card);
      color: var(--text-primary);
      box-shadow: 0 0 0 1px var(--border-primary);
    }

    /* ================= Palermo Hairline Grids & Table ================= */
    .pm-hairline-grid {
      display: grid;
      gap: 1px;
      background: var(--border-primary);
    }
    .pm-hairline-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .pm-hairline-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .pm-hairline-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 900px) {
      .pm-hairline-grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 860px) {
      .pm-hairline-grid.cols-3,
      .pm-hairline-grid.cols-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 540px) {
      .pm-hairline-grid.cols-4 { grid-template-columns: 1fr; }
    }
    .pm-grid-cell {
      background: var(--bg-surface);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }
    .pm-metric-cell {
      background: var(--bg-surface);
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pm-metric-val {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }
    .pm-blueprint-flow {
      display: grid;
      grid-template-columns: 1fr 42px 1fr 42px 1fr;
      align-items: stretch;
      background: var(--border-primary);
      gap: 1px;
    }
    .pm-blueprint-node {
      background: var(--bg-surface);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .pm-blueprint-arrow {
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
    }
    @media (max-width: 900px) {
      .pm-blueprint-flow { grid-template-columns: 1fr; }
      .pm-blueprint-arrow { height: 32px; transform: rotate(90deg); }
    }
    .pm-table-wrap {
      overflow-x: auto;
      background: var(--bg-surface);
    }
    .pm-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    .pm-table th {
      height: 42px;
      padding: 0 16px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-tertiary);
      border-bottom: 1px solid var(--border-primary);
      white-space: nowrap;
      background: var(--bg-surface);
    }
    .pm-table td {
      height: 54px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-secondary);
      white-space: nowrap;
      color: var(--text-secondary);
    }
    .pm-table tr:last-child td { border-bottom: none; }
    .pm-table tr.is-coda td {
      background: rgba(34, 197, 94, 0.035);
    }
    .pm-table tr.is-coda td:first-child {
      color: var(--text-primary);
      font-weight: 600;
    }
    .pm-dash-muted {
      color: var(--text-quaternary);
      font-family: var(--mono);
      font-size: 12px;
    }

    /* Closing CTA & Institutional Multi-Column Footer */
    .pm-cta-banner {
      padding: 40px 32px;
      background:
        radial-gradient(ellipse 70% 80% at 50% 0%, rgba(59, 130, 246, 0.08), transparent 70%),
        var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    .pm-footer-wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 28px 36px;
      border-left: 1px dashed var(--border-dashed);
      border-right: 1px dashed var(--border-dashed);
    }
    @media (max-width: 760px) {
      .pm-footer-wrap { padding: 32px 16px 28px; border-left: none; border-right: none; }
      .pm-cta-banner { padding: 28px 20px; }
    }
    .pm-footer-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr 1fr;
      gap: 28px;
    }
    @media (max-width: 820px) {
      .pm-footer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .pm-footer-grid { grid-template-columns: 1fr; }
    }
    .pm-footer-col-title {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .pm-footer-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .pm-footer-links a:hover { color: var(--text-primary); }
    .pm-footer-bottom {
      margin-top: 32px;
      padding-top: 18px;
      border-top: 1px solid var(--border-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* ================= Standalone Split-Screen Auth & Activate Vault ================= */
    .pm-auth-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(420px, 520px) minmax(0, 1fr);
      background: var(--bg-canvas);
    }
    @media (max-width: 960px) {
      .pm-auth-shell { grid-template-columns: 1fr; }
      .pm-auth-showcase { display: none !important; }
    }
    .pm-auth-main {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px 32px 28px;
      background: var(--bg-canvas);
    }
    @media (max-width: 520px) {
      .pm-auth-main { padding: 16px 18px 24px; }
    }
    .pm-auth-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .pm-auth-box {
      width: 100%;
      max-width: 396px;
      margin: auto;
      padding: 24px 0;
    }
    .pm-auth-emblem {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 8px 24px rgba(0, 0, 0, 0.25);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .pm-auth-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      padding: 3px;
      border-radius: 9px;
      background: var(--bg-surface);
      border: 1px solid var(--border-primary);
      margin-bottom: 20px;
    }
    .pm-auth-tab {
      height: 32px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-tertiary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.16s, background-color 0.16s;
    }
    .pm-auth-tab:hover { color: var(--text-primary); }
    .pm-auth-tab.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      box-shadow: 0 0 0 1px var(--border-primary);
    }
    .pm-auth-showcase {
      position: relative;
      background: var(--bg-surface);
      border-left: 1px solid var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px;
      overflow: hidden;
    }
    .pm-crypto-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 28px;
    }
    .pm-step-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-primary);
      background: var(--bg-card);
    }

    /* ================= Logged-in Interactive E2EE Console ================= */
    .shell-root {
      display: flex;
      height: 100vh;
      width: 100vw;
      background: var(--bg-canvas);
      color: var(--text-primary);
      overflow: hidden;
    }
    .left-sidebar {
      width: 280px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-primary);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .circle-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .circle-btn:hover {
      background: var(--bg-elevated);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .branch-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      margin-bottom: 4px;
    }
    .branch-item:hover { background: var(--bg-elevated); }
    .branch-item.active {
      background: var(--bg-elevated);
      border-color: var(--border-strong);
    }
    .main-terminal-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 16px 10px;
      background: var(--bg-canvas);
    }
    .term-viewport {
      flex: 1;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.62;
      padding: 10px 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-primary);
    }
    .cursor-box {
      display: inline-block;
      border: 1.5px solid var(--text-primary);
      min-width: 9px;
      padding: 0 1px;
      line-height: 1.1;
    }
    .desktop-composer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-primary);
    }
    .desktop-composer-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .desktop-composer-inp {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-primary);
    }
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 6px;
      height: 98px;
      padding-top: 8px;
      border-top: 1px solid var(--border-primary);
      font-family: var(--mono);
      font-size: 13px;
    }
    .keypad-left {
      grid-column: span 10 / span 10;
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .keypad-row {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 6px;
    }
    .k-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
