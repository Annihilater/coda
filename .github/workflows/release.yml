name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.2.3)"
        required: true
        default: "v0.2.3"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64 (Server + Daemon + Web + Deploy Kit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libzstd-dev
      - name: Build Web Console
        run: cd web && bun install && bun run build
      - name: Build coda-server & coda-daemon (release)
        run: cargo build --release -p coda-server -p coda-daemon
      - name: Package Linux x86_64 Artifacts
        run: |
          mkdir -p dist/coda-server-linux-x86_64 dist/coda-daemon-linux-x86_64
          cp target/release/coda-server dist/coda-server-linux-x86_64/
          cp -r web/dist dist/coda-server-linux-x86_64/web-dist
          cp -r migrations dist/coda-server-linux-x86_64/migrations
          cp -r deploy dist/coda-server-linux-x86_64/deploy
          cp README.md dist/coda-server-linux-x86_64/

          cp target/release/coda-daemon dist/coda-daemon-linux-x86_64/
          cp deploy/install-daemon.sh dist/coda-daemon-linux-x86_64/

          tar --owner=0 --group=0 -C dist -czf "dist/coda-server-linux-x86_64-${RELEASE_TAG}.tar.gz" coda-server-linux-x86_64
          tar --owner=0 --group=0 -C dist -czf "dist/coda-daemon-linux-x86_64-${RELEASE_TAG}.tar.gz" coda-daemon-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-artifacts
          path: |
            dist/*.tar.gz

  build-linux-aarch64:
    name: Build Linux ARM64 (Server + Daemon)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libzstd-dev
      - name: Build Web Console
        run: cd web && bun install && bun run build
      - name: Build coda-server & coda-daemon (release)
        run: cargo build --release -p coda-server -p coda-daemon
      - name: Package Linux aarch64
        run: |
          mkdir -p dist/coda-server-linux-aarch64 dist/coda-daemon-linux-aarch64
          cp target/release/coda-server dist/coda-server-linux-aarch64/
          cp -r web/dist dist/coda-server-linux-aarch64/web-dist
          cp -r migrations dist/coda-server-linux-aarch64/migrations
          cp -r deploy dist/coda-server-linux-aarch64/deploy
          cp README.md dist/coda-server-linux-aarch64/

          cp target/release/coda-daemon dist/coda-daemon-linux-aarch64/
          cp deploy/install-daemon.sh dist/coda-daemon-linux-aarch64/

          tar --owner=0 --group=0 -C dist -czf "dist/coda-server-linux-aarch64-${RELEASE_TAG}.tar.gz" coda-server-linux-aarch64
          tar --owner=0 --group=0 -C dist -czf "dist/coda-daemon-linux-aarch64-${RELEASE_TAG}.tar.gz" coda-daemon-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-artifacts
          path: |
            dist/*.tar.gz

  build-macos-aarch64:
    name: Build macOS Apple Silicon (GPUI Desktop + Daemon + Server + SwiftUI)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Build Web Console
        run: cd web && bun install && bun run build
      - name: Build Rust Release Binaries (coda-desktop GPUI + coda-daemon + coda-server)
        run: cargo build --release -p coda-server -p coda-daemon -p coda-desktop
      - name: Build Apple Swift 6 Native Binaries
        run: cd apple && swift build -c release
      - name: Package macOS Apple Silicon Suite
        run: |
          mkdir -p dist/coda-macos-aarch64 dist/coda-daemon-macos-aarch64
          cp target/release/coda-desktop dist/coda-macos-aarch64/
          cp target/release/coda-daemon dist/coda-macos-aarch64/
          cp target/release/coda-server dist/coda-macos-aarch64/
          cp apple/.build/release/CodaMacApp dist/coda-macos-aarch64/
          cp -r web/dist dist/coda-macos-aarch64/web-dist
          cp -r deploy dist/coda-macos-aarch64/deploy
          cp README.md dist/coda-macos-aarch64/

          cp target/release/coda-daemon dist/coda-daemon-macos-aarch64/
          cp deploy/install-daemon.sh dist/coda-daemon-macos-aarch64/

          tar -C dist -czf "dist/coda-macos-aarch64-${RELEASE_TAG}.tar.gz" coda-macos-aarch64
          tar -C dist -czf "dist/coda-daemon-macos-aarch64-${RELEASE_TAG}.tar.gz" coda-daemon-macos-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64-artifacts
          path: |
            dist/*.tar.gz

  publish-github-release:
    name: Publish Multi-Arch GHCR Image & GitHub Release
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Set up QEMU & Docker Buildx
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Multi-Arch Docker Build Context
        run: |
          mkdir -p docker-ctx/bin/linux-amd64 docker-ctx/bin/linux-arm64 docker-ctx/web docker-ctx/deploy dist-unpack
          tar -C dist-unpack -xzf "release-assets/coda-server-linux-x86_64-${RELEASE_TAG}.tar.gz"
          tar -C dist-unpack -xzf "release-assets/coda-daemon-linux-x86_64-${RELEASE_TAG}.tar.gz"
          tar -C dist-unpack -xzf "release-assets/coda-server-linux-aarch64-${RELEASE_TAG}.tar.gz"
          tar -C dist-unpack -xzf "release-assets/coda-daemon-linux-aarch64-${RELEASE_TAG}.tar.gz"

          cp dist-unpack/coda-server-linux-x86_64/coda-server docker-ctx/bin/linux-amd64/coda-server
          cp dist-unpack/coda-daemon-linux-x86_64/coda-daemon docker-ctx/bin/linux-amd64/coda-daemon
          cp dist-unpack/coda-server-linux-aarch64/coda-server docker-ctx/bin/linux-arm64/coda-server
          cp dist-unpack/coda-daemon-linux-aarch64/coda-daemon docker-ctx/bin/linux-arm64/coda-daemon
          cp -r dist-unpack/coda-server-linux-x86_64/web-dist docker-ctx/web/dist
          cp deploy/install-daemon.sh docker-ctx/deploy/install-daemon.sh

          cat > docker-ctx/Dockerfile <<'DOCKERFILE_EOF'
          FROM debian:bookworm-slim
          ARG TARGETARCH=amd64
          LABEL org.opencontainers.image.source="https://github.com/Annihilater/coda"
          LABEL org.opencontainers.image.description="Coda Zero-Knowledge AI Agent Mesh Coordinator & Stateless Relay"
          LABEL org.opencontainers.image.licenses="MIT"
          RUN apt-get update && apt-get install -y ca-certificates curl git libzstd1 && rm -rf /var/lib/apt/lists/*
          WORKDIR /opt/coda
          COPY bin/linux-${TARGETARCH}/coda-server /usr/local/bin/coda-server
          COPY bin/linux-${TARGETARCH}/coda-daemon /usr/local/bin/coda-daemon
          COPY web/dist /opt/coda/web/dist
          COPY deploy/install-daemon.sh /opt/coda/deploy/install-daemon.sh
          EXPOSE 8080 24443
          ENTRYPOINT ["coda-server"]
          CMD ["--web-dist", "/opt/coda/web/dist"]
          DOCKERFILE_EOF

      - name: Push Multi-Arch Image to ghcr.io/annihilater/coda
        uses: docker/build-push-action@v6
        with:
          context: docker-ctx
          file: docker-ctx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/annihilater/coda:${{ env.RELEASE_TAG }}
            ghcr.io/annihilater/coda:latest

      - name: Export Offline Container Image Tarballs for GitHub Releases Fallback
        run: |
          docker buildx build --platform linux/amd64 \
            -t "ghcr.io/annihilater/coda:${RELEASE_TAG}" \
            --output type=docker,dest=- docker-ctx \
            | gzip -1 > "release-assets/coda-image-linux-amd64-${RELEASE_TAG}.tar.gz"
          docker buildx build --platform linux/arm64 \
            -t "ghcr.io/annihilater/coda:${RELEASE_TAG}" \
            --output type=docker,dest=- docker-ctx \
            | gzip -1 > "release-assets/coda-image-linux-arm64-${RELEASE_TAG}.tar.gz"

      - name: Assemble Clean coda-deploy-bundle (No Dockerfile, Prebuilt Image + Lifecycle Scripts)
        run: |
          BUNDLE_DIR="dist-bundle/coda-deploy-bundle"
          mkdir -p "${BUNDLE_DIR}"

          cp deploy/DEPLOY.md "${BUNDLE_DIR}/DEPLOY.md"
          cp README.md "${BUNDLE_DIR}/README.md"
          cp -r migrations "${BUNDLE_DIR}/migrations"

          cp deploy/coda-server.service "${BUNDLE_DIR}/coda-server.service"
          cp deploy/coda-relay-cn.service "${BUNDLE_DIR}/coda-relay-cn.service"

          sed "s|ghcr.io/annihilater/coda:latest|ghcr.io/annihilater/coda:${RELEASE_TAG}|g" \
            deploy/.env.example > "${BUNDLE_DIR}/.env.example"
          sed "s|ghcr.io/annihilater/coda:latest|ghcr.io/annihilater/coda:${RELEASE_TAG}|g" \
            deploy/docker-compose.yml > "${BUNDLE_DIR}/docker-compose.yml"

          for s in coda.sh start.sh stop.sh restart.sh status.sh logs.sh update.sh install-server.sh install-relay-cn.sh install-daemon.sh; do
            cp "deploy/${s}" "${BUNDLE_DIR}/${s}"
            chmod 0755 "${BUNDLE_DIR}/${s}"
          done
          chmod 0644 "${BUNDLE_DIR}/.env.example" "${BUNDLE_DIR}/docker-compose.yml" "${BUNDLE_DIR}/coda-server.service" "${BUNDLE_DIR}/coda-relay-cn.service"

          tar --owner=0 --group=0 -C dist-bundle -czf "release-assets/coda-deploy-bundle-${RELEASE_TAG}.tar.gz" coda-deploy-bundle

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum *.tar.gz > "SHA256SUMS-${RELEASE_TAG}.txt"
          cat "SHA256SUMS-${RELEASE_TAG}.txt"

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Coda ${{ env.RELEASE_TAG }} · Zero-Knowledge AI Agent Mesh (GPUI + SwiftUI + E2EE)"
          body_path: deploy/DEPLOY.md
          draft: false
          prerelease: false
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS-*.txt
